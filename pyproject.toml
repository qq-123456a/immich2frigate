[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "immich2frigate"
version = "0.1.0a0"
description = "Safely prepare and synchronize Immich face training images to Frigate"
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"

[project.scripts]
immich2frigate = "immich2frigate.cli:main"

[project.optional-dependencies]
compat = [
    "numpy>=2.2.6",
    "pillow>=12.1.0",
]
curator = [
    "requests>=2.32.5",
]
database = ["psycopg[binary]>=3.2"]
vision = ["opencv-contrib-python-headless>=4.10,<5"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
